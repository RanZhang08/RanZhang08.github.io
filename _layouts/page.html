---
layout: default
---

<header class="post-header">
  <h1 class="post-title">
    {% if page.header_title %}
      {{ page.header_title }}
    {% else %}
      {{ page.title }}
    {% endif %}
  </h1>
  <p class="post-description">{{ page.description }}</p>
</header>


<!-- page.html -->
        <div class="post">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-description">{{ page.description }}</p>
          </header>

          <article>
            {{ content }}
          </article>

        </div>
