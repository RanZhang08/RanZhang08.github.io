- name: Natalie Rittenhouse
  role: Postdoctoral Researcher
  image: assets/img/lab/NatalieRittenhouse.jpeg
  bio: >
    Natalie earned her PhD in Genetics and Molecular Biology at UNC- Chapel Hill, 
    where she trained under Dr. Jill Dowen to investigate protein-protein interactions 
    that regulate DNA organization and ensure proper gene expression. 
    Building on this foundation, her current research utilizes machine learning approaches 
    that integrate functional genomics and quantitative genetics to identify context-specific 
    genes and pathways driving complex diseases. 
    Through this work, she aims to bridge molecular biology and computational innovation to 
    advance our understanding of disease mechanisms and inform future therapeutic strategies. 
